name: Deploy
on:
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: Run the real sample PDF through the deployed stack (incurs AWS usage)
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rag-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SAM_CLI_TELEMETRY: '0'
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'rag-pdf' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_CLOUDFORMATION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
      AWS_ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
      RUN_SMOKE_TEST: ${{ github.event_name == 'push' || inputs.run_smoke_test }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12', cache: pip}
      - name: Check AWS deployment configuration
        run: |
          for variable in AWS_DEPLOY_ROLE_ARN AWS_CLOUDFORMATION_ROLE_ARN AWS_ARTIFACT_BUCKET; do
            if [ -z "${!variable}" ]; then
              echo "Configure $variable using scripts/bootstrap_github.py before running deployment."
              exit 1
            fi
          done
      - name: Authenticate with AWS OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Deploy pipeline and verify sample PDF
        run: |
          deployment_args=(--region "$AWS_REGION" --stack-name "$AWS_STACK_NAME" --cloudformation-role-arn "$AWS_CLOUDFORMATION_ROLE_ARN" --artifact-bucket "$AWS_ARTIFACT_BUCKET")
          if [ "$RUN_SMOKE_TEST" = 'true' ]; then
            deployment_args+=(--smoke-test)
          fi
          python -m scripts.deploy "${deployment_args[@]}"
